name: Build OrangeFox

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "FOX_BUILD_TYPE"
        default: "Unofficial"
        required: true
      maintainer:
        description: "OF_MAINTAINER"
        default: "Sype0"
        required: true
      publish:
        description: "Publish the result as a GitHub release"
        type: boolean
        default: true

env:
  FOX_BRANCH: "12.1"
  FOX_DEVICE: topaz
  MAGISK_VERSION: v30.7
  FOX_DIR: ${{ github.workspace }}/fox

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          df -h /

      - name: Check out the device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Install the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libtinfo5 libxml2 libxml2-utils lzop patch pngcrush python-is-python3 \
            python3 rsync schedtool squashfs-tools unzip xsltproc xz-utils zip zlib1g-dev
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          git config --global advice.detachedHead false

      - name: Sync the OrangeFox sources
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/sync"
          cd "$GITHUB_WORKSPACE/sync"
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_DIR"
          test -f "$FOX_DIR/build/envsetup.sh"
          test -d "$FOX_DIR/bootable/recovery"
          test -d "$FOX_DIR/vendor/recovery"
          df -h /

      - name: Place the device tree
        run: |
          mkdir -p "$FOX_DIR/device/xiaomi"
          rm -rf "$FOX_DIR/device/xiaomi/$FOX_DEVICE"
          mv "$GITHUB_WORKSPACE/tree" "$FOX_DIR/device/xiaomi/$FOX_DEVICE"

      - name: Fetch the Magisk addon
        run: |
          mkdir -p ~/Magisk
          curl -fL "https://github.com/topjohnwu/Magisk/releases/download/$MAGISK_VERSION/Magisk-$MAGISK_VERSION.apk" \
            -o ~/Magisk/Magisk-$MAGISK_VERSION.zip
          unzip -tq ~/Magisk/Magisk-$MAGISK_VERSION.zip

      - name: Build
        env:
          FOX_BUILD_TYPE: ${{ inputs.build_type }}
          OF_MAINTAINER: ${{ inputs.maintainer }}
        run: |
          set +e
          cd "$FOX_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$FOX_DEVICE"
          export LC_ALL="C"
          source build/envsetup.sh
          lunch "twrp_${FOX_DEVICE}-eng" || exit 1
          mka adbd recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          ls -l "out/target/product/$FOX_DEVICE"/OrangeFox-* || exit 1

      - name: Collect the output
        id: out
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$FOX_DIR/out/target/product/$FOX_DEVICE"
          cp -v OrangeFox-*.img OrangeFox-*.zip "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum * | tee sha256sums.txt
          img=$(ls OrangeFox-*.img | head -n1)
          echo "name=${img%.img}" >> "$GITHUB_OUTPUT"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: dist/*

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.out.outputs.name }}-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.out.outputs.name }}" \
            --notes "OrangeFox (fox_$FOX_BRANCH) for Redmi Note 12 4G (tapas/topaz), build type: ${{ inputs.build_type }}.
          Flash the .img to both recovery slots (\`fastboot flash recovery_ab <img>\`) or install the .zip from recovery."
